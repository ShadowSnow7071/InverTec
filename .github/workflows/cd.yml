name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      RAILWAY_VERSION: "5.2.0"
      RAILWAY_BIN_DIR: ${{ github.workspace }}/.railway-bin
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: |
          bash <(curl -fsSL https://railway.com/install.sh) -y
          echo "$RAILWAY_BIN_DIR" >> "$GITHUB_PATH"

      - name: Desplegar a Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service invertec --detach