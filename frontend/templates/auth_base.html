<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}InverTec{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body class="auth-body">
    <div class="auth-split">
      <div class="auth-form-side">
        <a class="auth-logo" href="{{ url_for('main.index') }}">
          <span class="auth-logo-badge">IT</span> InverTec
        </a>
        <div class="auth-form-wrap">
          {% block content %}{% endblock %}
        </div>
      </div>
      <div class="auth-hero-side">
        <h1 class="auth-hero-title">
          Practica invirtiendo<br />sin arriesgar<br />tu dinero<span class="auth-hero-dot">.</span>
        </h1>
        <p class="auth-hero-copy">
          Compra y vende acciones reales en simulación. Aprende cómo funciona el mercado antes de invertir de verdad.
        </p>
        <p class="auth-hero-footer">© 2026 InverTec · Plataforma educativa</p>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
