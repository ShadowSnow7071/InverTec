<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}InverTec{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body class="app-body">
    <div class="app-shell" id="app-shell">
      <aside class="app-sidebar" id="app-sidebar">
        <a class="app-logo" href="{{ url_for('main.perfil') }}">
          <span class="app-logo-badge" aria-hidden="true">↗</span>
          <span class="app-logo-text">InverTec</span>
        </a>
        <nav class="app-nav" aria-label="Navegación principal">
          <a class="app-nav-link {{ 'activo' if seccion_activa == 'inicio' else '' }}" href="{{ url_for('main.perfil') }}">
            <span class="app-nav-icon" aria-hidden="true">⌂</span>
            <span class="app-nav-label">Inicio</span>
          </a>
          <a class="app-nav-link {{ 'activo' if seccion_activa == 'mercado' else '' }}" href="{{ url_for('main.mercado') }}">
            <span class="app-nav-icon" aria-hidden="true">↗</span>
            <span class="app-nav-label">Mercado</span>
          </a>
          <a class="app-nav-link {{ 'activo' if seccion_activa == 'simular' else '' }}" href="{{ url_for('main.simular') }}">
            <span class="app-nav-icon" aria-hidden="true">＋</span>
            <span class="app-nav-label">Simular</span>
            <span class="app-nav-dot" aria-hidden="true"></span>
          </a>
          <a class="app-nav-link {{ 'activo' if seccion_activa == 'historial' else '' }}" href="{{ url_for('main.historial') }}">
            <span class="app-nav-icon" aria-hidden="true">↺</span>
            <span class="app-nav-label">Historial</span>
          </a>
          <a class="app-nav-link {{ 'activo' if seccion_activa == 'analisis' else '' }}" href="{{ url_for('main.analisis') }}">
            <span class="app-nav-icon" aria-hidden="true">▤</span>
            <span class="app-nav-label">Análisis</span>
          </a>
        </nav>
        <div class="app-sidebar-footer">
          <button class="app-sidebar-link" type="button" disabled title="Próximamente">
            <span aria-hidden="true">☀</span> <span class="app-nav-label">Modo claro</span>
          </button>
          <button class="app-sidebar-link" id="btn-colapsar" type="button">
            <span aria-hidden="true">‹</span> <span class="app-nav-label">Colapsar</span>
          </button>
        </div>
      </aside>

      <div class="app-sidebar-backdrop" id="app-sidebar-backdrop"></div>

      <div class="app-main">
        <header class="app-topbar">
          <div class="d-flex align-items-center gap-2">
            <button class="app-menu-toggle" id="btn-menu-movil" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="app-sidebar">
              <span aria-hidden="true">☰</span>
            </button>
            <p class="app-breadcrumb mb-0">{% block breadcrumb %}{% endblock %}</p>
          </div>
          <div class="dropdown app-user">
            <button class="app-user-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <span class="app-avatar" aria-hidden="true">{{ (usuario_actual.nombre or "?")[:2]|upper }}</span>
              <span class="app-user-info">
                <strong>{{ usuario_actual.nombre }}</strong>
                <small>{{ usuario_actual.rol.value|capitalize }}</small>
              </span>
              <span aria-hidden="true">⌄</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="{{ url_for('main.configuracion') }}">Configuración</a></li>
              <li>
                <form method="post" action="{{ url_for('main.logout') }}">
                  <button class="dropdown-item" type="submit">Cerrar sesión</button>
                </form>
              </li>
            </ul>
          </div>
        </header>

        <main class="app-content">
          {% block content %}{% endblock %}
        </main>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <script>
      const btnColapsar = document.getElementById("btn-colapsar");
      const appShell = document.getElementById("app-shell");
      if (btnColapsar) {
        btnColapsar.addEventListener("click", () => {
          appShell.classList.toggle("app-shell-colapsado");
        });
      }

      const btnMenuMovil = document.getElementById("btn-menu-movil");
      const sidebarBackdrop = document.getElementById("app-sidebar-backdrop");

      function cerrarSidebarMovil() {
        appShell.classList.remove("app-shell-sidebar-abierta");
        if (btnMenuMovil) btnMenuMovil.setAttribute("aria-expanded", "false");
      }

      if (btnMenuMovil) {
        btnMenuMovil.addEventListener("click", () => {
          const abierta = appShell.classList.toggle("app-shell-sidebar-abierta");
          btnMenuMovil.setAttribute("aria-expanded", abierta ? "true" : "false");
        });
      }
      if (sidebarBackdrop) {
        sidebarBackdrop.addEventListener("click", cerrarSidebarMovil);
      }
    </script>
    {% block scripts %}{% endblock %}
  </body>
</html>
