<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}InverTec{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="{{ url_for('main.index') }}">InverTec</a>
        <div class="ms-auto">
          {% if usuario_actual %}
          <a class="btn btn-light btn-sm me-2" href="{{ url_for('main.perfil') }}">Mi portafolio</a>
          <form class="d-inline" method="post" action="{{ url_for('main.logout') }}">
            <button class="btn btn-outline-light btn-sm" type="submit">Salir</button>
          </form>
          {% else %}
          <a class="btn btn-outline-light btn-sm me-2" href="{{ url_for('main.login_form') }}">Iniciar sesión</a>
          <a class="btn btn-light btn-sm" href="{{ url_for('main.registro_form') }}">Crear cuenta</a>
          {% endif %}
        </div>
      </div>
    </nav>
    <main class="container py-4">
      {% block content %}{% endblock %}
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
