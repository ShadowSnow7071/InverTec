{% extends "base.html" %}

{% block title %}Crear cuenta | InverTec{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h1 class="h3 mb-4">Crear cuenta</h1>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensajes %}
        <div class="alert alert-{{ categoria }}" role="alert">{{ texto }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post" action="{{ url_for('main.registro_post') }}">
      <div class="mb-3">
        <label class="form-label" for="nombre">Nombre</label>
        <input class="form-control" id="nombre" name="nombre" type="text" maxlength="120" required autofocus />
      </div>
      <div class="mb-3">
        <label class="form-label" for="correo">Correo</label>
        <input class="form-control" id="correo" name="correo" type="email" required />
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-control" id="password" name="password" type="password" minlength="8" required />
      </div>
      <button class="btn btn-primary" type="submit">Registrarme</button>
    </form>
  </div>
</div>
{% endblock %}
