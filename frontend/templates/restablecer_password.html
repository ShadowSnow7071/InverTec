{% extends "auth_base.html" %}

{% block title %}Restablecer contraseña | InverTec{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Restablecer contraseña</h1>

<form id="restablecer-form" class="w-100">
  <div class="auth-field">
    <label for="restablecer-password">Nueva contraseña</label>
    <div class="auth-input-wrap">
      <input
        class="form-control"
        id="restablecer-password"
        type="password"
        minlength="8"
        maxlength="32"
        pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,32}"
        aria-describedby="restablecer-password-ayuda"
        placeholder="Mínimo 8 caracteres"
        required
      />
      <button class="auth-toggle-password" type="button" data-toggle-target="restablecer-password" aria-label="Mostrar contraseña" aria-pressed="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </button>
    </div>
    <small class="form-text text-muted d-block mt-2" id="restablecer-password-ayuda">Debe tener entre 8 y 32 caracteres, una mayúscula, una minúscula, un número y un símbolo.</small>
  </div>
  <button class="btn btn-primary w-100" type="submit">Actualizar contraseña</button>
</form>
<div id="restablecer-resultado" class="alert d-none mt-3 w-100" role="alert"></div>
{% endblock %}

{% block scripts %}
<script>
  document.querySelectorAll(".auth-toggle-password").forEach(function (boton) {
    boton.addEventListener("click", function () {
      var input = document.getElementById(boton.dataset.toggleTarget);
      if (!input) return;
      var visible = input.type === "text";
      input.type = visible ? "password" : "text";
      boton.setAttribute("aria-pressed", String(!visible));
    });
  });

  document.getElementById("restablecer-form").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const resultado = document.getElementById("restablecer-resultado");
    try {
      const respuesta = await fetch("/api/auth/restablecer-password", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          token: new URLSearchParams(window.location.search).get("token"),
          password: document.getElementById("restablecer-password").value,
        }),
      });
      const cuerpo = await respuesta.json();
      if (!respuesta.ok) throw new Error(cuerpo.error || "No fue posible actualizar la contraseña");
      resultado.textContent = cuerpo.mensaje;
      resultado.className = "alert alert-success mt-3 w-100";
      setTimeout(() => {
        window.location.href = "/login";
      }, 1200);
    } catch (error) {
      resultado.textContent = error.message;
      resultado.className = "alert alert-danger mt-3 w-100";
    }
  });
</script>
{% endblock %}
