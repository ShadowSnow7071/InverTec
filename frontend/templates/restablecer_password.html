{% extends "base.html" %}

{% block title %}Restablecer contraseña | InverTec{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="auth-panel p-4 p-md-5">
      <h1 class="h3 mb-3">Restablecer contraseña</h1>
      <form id="restablecer-form">
        <label class="form-label" for="restablecer-password">Nueva contraseña</label>
        <div class="input-group mb-2">
          <input class="form-control" id="restablecer-password" type="password" minlength="8" maxlength="32" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,32}" aria-describedby="restablecer-password-ayuda" required />
          <button class="btn btn-outline-secondary" id="mostrar-restablecer-password" type="button" aria-label="Mostrar contraseña" aria-pressed="false">Mostrar</button>
        </div>
        <small class="form-text text-muted d-block mb-3" id="restablecer-password-ayuda">Debe tener entre 8 y 32 caracteres, una mayúscula, una minúscula, un número y un símbolo.</small>
        <button class="btn btn-primary" type="submit">Actualizar contraseña</button>
      </form>
      <div id="restablecer-resultado" class="alert d-none mt-3" role="alert"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const restablecerPassword = document.getElementById("restablecer-password");
  const mostrarRestablecerPassword = document.getElementById("mostrar-restablecer-password");

  mostrarRestablecerPassword.addEventListener("click", () => {
    const visible = restablecerPassword.type === "text";
    restablecerPassword.type = visible ? "password" : "text";
    mostrarRestablecerPassword.textContent = visible ? "Mostrar" : "Ocultar";
    mostrarRestablecerPassword.setAttribute("aria-label", visible ? "Mostrar contraseña" : "Ocultar contraseña");
    mostrarRestablecerPassword.setAttribute("aria-pressed", String(!visible));
  });

  document.getElementById("restablecer-form").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const resultado = document.getElementById("restablecer-resultado");
    try {
      const respuesta = await fetch("/api/auth/restablecer-password", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          token: new URLSearchParams(window.location.search).get("token"),
          password: document.getElementById("restablecer-password").value,
        }),
      });
      const cuerpo = await respuesta.json();
      if (!respuesta.ok) throw new Error(cuerpo.error || "No fue posible actualizar la contraseña");
      resultado.textContent = cuerpo.mensaje;
      resultado.className = "alert alert-success mt-3";
      setTimeout(() => {
        window.location.href = "/login";
      }, 1200);
    } catch (error) {
      resultado.textContent = error.message;
      resultado.className = "alert alert-danger mt-3";
    }
  });
</script>
{% endblock %}
