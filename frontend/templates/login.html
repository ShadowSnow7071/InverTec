{% extends "base.html" %}

{% block title %}Iniciar sesión | InverTec{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h1 class="h3 mb-4">Iniciar sesión</h1>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, texto in mensajes %}
        <div class="alert alert-{{ categoria }}" role="alert">{{ texto }}</div>
      {% endfor %}
    {% endwith %}
    <form method="post" action="{{ url_for('main.login_post') }}">
      <div class="mb-3">
        <label class="form-label" for="correo">Correo</label>
        <input class="form-control" id="correo" name="correo" type="email" required autofocus />
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Contraseña</label>
        <input class="form-control" id="password" name="password" type="password" required />
      </div>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
