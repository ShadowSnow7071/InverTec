{% extends "auth_base.html" %}

{% block title %}Recuperar contraseña | InverTec{% endblock %}

{% block content %}
<h1 class="h3">Recuperar contraseña</h1>
<p class="text-muted mb-4">Escribe tu correo y recibirás un enlace si existe una cuenta asociada.</p>

<form id="recuperar-form" class="w-100">
  <div class="auth-field">
    <label for="recuperar-correo">Correo electrónico</label>
    <input class="form-control" id="recuperar-correo" type="email" placeholder="tu@correo.com" required autofocus />
  </div>
  <button class="btn btn-primary w-100" type="submit">Enviar enlace</button>
</form>
<div id="recuperar-resultado" class="alert d-none mt-3 w-100" role="alert"></div>
<p class="text-muted mt-4"><a href="{{ url_for('main.login_form') }}">Volver a iniciar sesión</a></p>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById("recuperar-form").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const resultado = document.getElementById("recuperar-resultado");
    try {
      const respuesta = await fetch("/api/auth/recuperar-password", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({correo: document.getElementById("recuperar-correo").value}),
      });
      const cuerpo = await respuesta.json();
      if (!respuesta.ok) throw new Error(cuerpo.error || "No fue posible solicitar la recuperación");
      resultado.textContent = cuerpo.mensaje;
      resultado.className = "alert alert-success mt-3 w-100";
    } catch (error) {
      resultado.textContent = error.message;
      resultado.className = "alert alert-danger mt-3 w-100";
    }
  });
</script>
{% endblock %}
