{% extends "base.html" %}

{% block title %}Recuperar contraseña | InverTec{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="auth-panel p-4 p-md-5">
      <h1 class="h3 mb-3">Recuperar contraseña</h1>
      <p class="text-muted">Escribe tu correo y recibirás un enlace si existe una cuenta asociada.</p>
      <form id="recuperar-form">
        <label class="form-label" for="recuperar-correo">Correo</label>
        <input class="form-control mb-3" id="recuperar-correo" type="email" required autofocus />
        <button class="btn btn-primary" type="submit">Enviar enlace</button>
      </form>
      <div id="recuperar-resultado" class="alert d-none mt-3" role="alert"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById("recuperar-form").addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const resultado = document.getElementById("recuperar-resultado");
    try {
      const respuesta = await fetch("/api/auth/recuperar-password", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({correo: document.getElementById("recuperar-correo").value}),
      });
      const cuerpo = await respuesta.json();
      if (!respuesta.ok) throw new Error(cuerpo.error || "No fue posible solicitar la recuperación");
      resultado.textContent = cuerpo.mensaje;
      resultado.className = "alert alert-success mt-3";
    } catch (error) {
      resultado.textContent = error.message;
      resultado.className = "alert alert-danger mt-3";
    }
  });
</script>
{% endblock %}
