{% extends "base.html" %}

{% block title %}InverTec{% endblock %}

{% block content %}
<div class="hero-panel my-4 p-4 p-md-5">
  <p class="text-uppercase small fw-semibold text-muted mb-2">Aprende invirtiendo</p>
  <h1 class="display-5 fw-bold">InverTec</h1>
  <p class="lead text-muted">
    Simulador de inversión para aprender a gestionar riesgo y recompensa.
  </p>
  {% if usuario_actual %}
  <a class="btn btn-primary" href="{{ url_for('main.perfil') }}">Ver mi portafolio</a>
  {% else %}
  <a class="btn btn-primary" href="{{ url_for('main.registro_form') }}">Comenzar</a>
  {% endif %}
</div>
{% endblock %}
