services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: invertec
      MYSQL_USER: invertec
      MYSQL_PASSWORD: invertec
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Sobrescribe lo que traiga .env: dentro de la red de docker compose
      # la base no vive en localhost, vive en el servicio "db".
      DATABASE_URL: mysql+pymysql://invertec:invertec@db:3306/invertec
      APP_CONFIG: development
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
